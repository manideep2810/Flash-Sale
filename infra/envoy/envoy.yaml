# The API gateway: the only port clients use (8080). Mounted into the envoy container by
# infra/docker/docker-compose.yml.
#
# The services run on the host (`make dev`), not in compose, so the clusters at the bottom point at
# host.docker.internal. Each service keeps its own paths; the routes rewrite /api/... onto them.
#
# What a request passes through, in order:
#   1. router

admin:
  # Stats (/stats/prometheus), clusters and the config dump. The config dump includes the JWT keys,
  # so this port is published to 127.0.0.1 only and must never be exposed further.
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: api
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gateway
                codec_type: AUTO
                # This is the edge. The client's address is the socket's, never one a header claims.
                use_remote_address: true
                xff_num_trusted_hops: 0
                # Every request gets an x-request-id here; it is passed upstream and the services log it.
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          route: "%ROUTE_NAME%"
                          status: "%RESPONSE_CODE%"
                          # flags says that Envoy answered and broadly why (RL = rate limited, UAEX = refused by a
                          # filter); details says which filter: local_rate_limited is the local bucket,
                          # request_rate_limited the global service, jwt_authn_access_denied{...} the token check.
                          flags: "%RESPONSE_FLAGS%"
                          details: "%RESPONSE_CODE_DETAILS%"
                          user: "%REQ(X-USER-ID)%"
                          client: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          upstream: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: api
                  virtual_hosts:
                    - name: api
                      domains: ["*"]
                      # Each route's name is also its rate-limit key and its label in the metrics. POST routes
                      # are never retried.
                      routes:
                        # POST /api/auth/dev-login -> order-api /auth/dev-login
                        - name: login
                          match:
                            path: /api/auth/dev-login
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route:
                            cluster: order-api
                            prefix_rewrite: /auth/dev-login
                            timeout: 2s
                        # POST /api/queue/:eventId/join -> queue-svc /queue/:eventId/join
                        - name: join
                          match:
                            safe_regex: { regex: "/api/queue/[^/]+/join" }
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route:
                            cluster: queue-svc
                            regex_rewrite: { pattern: { regex: "^/api/" }, substitution: / }
                            timeout: 2s
                        # GET /api/queue/:eventId/status -> queue-svc /queue/:eventId/status
                        - name: status
                          match:
                            safe_regex: { regex: "/api/queue/[^/]+/status" }
                            headers: [{ name: ":method", string_match: { exact: GET } }]
                          route:
                            cluster: queue-svc
                            regex_rewrite: { pattern: { regex: "^/api/" }, substitution: / }
                            timeout: 2s
                        # POST /api/reserve -> ticket service /redis/reserve
                        - name: reserve
                          match:
                            path: /api/reserve
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route:
                            cluster: ticket
                            prefix_rewrite: /redis/reserve
                            timeout: 1s
                        # /api/orders/* -> order-api /orders/*
                        - name: orders
                          match:
                            prefix: /api/orders/
                          route:
                            cluster: order-api
                            prefix_rewrite: /orders/
                            timeout: 3s
                        # The web app arrives with the Next.js pages (item 5):
                        # - name: web
                        #   match: { prefix: / }
                        #   route: { cluster: web }

  clusters:
    # order-api: the login and /orders. services/order, PORT 3003.
    - name: order-api
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: order-api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3003 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /healthz/ready }
      outlier_detection:
        consecutive_5xx: 5
        base_ejection_time: 30s
    # The reservation API. services/ticket, PORT 3001.
    - name: ticket
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: ticket
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3001 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /healthz/ready }
      outlier_detection:
        consecutive_5xx: 5
        base_ejection_time: 30s
    # The waiting room. services/queue, PORT 4100.
    - name: queue-svc
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: queue-svc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 4100 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /readyz }
      outlier_detection:
        consecutive_5xx: 5
        base_ejection_time: 30s
