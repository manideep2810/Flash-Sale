# The API gateway: the only port clients use (8080). Mounted into the envoy container by
# infra/docker/docker-compose.yml.
#
# THIS FILE IS A TEMPLATE. entrypoint.sh fills in each dollar-brace placeholder from the
# container's environment at start and runs Envoy on the result, so no secret is committed here:
#   ${SESSION_JWK_K}, ${ADMISSION_JWK_K}   the two HS256 keys, from SESSION_SECRET and ADMISSION_SECRET
#
# The services run on the host (`make dev`), not in compose, so the clusters at the bottom point at
# host.docker.internal. Each service keeps its own paths; the routes rewrite /api/... onto them.
#
# What a request passes through, in order:
#   1. jwt_authn          the session on every /api route but the login, plus the admission token on
#                         reserve. A request that fails here never reaches a service.
#   2. global rate limit  per user and per client address, counted by the ratelimit service
#                         (infra/ratelimit/config/flashsale.yaml). Fails open.
#   3. router
#
# The services check the session and the admission token again themselves. This is the first
# check, not the only one.

admin:
  # Stats (/stats/prometheus), clusters and the config dump. The config dump includes the JWT keys,
  # so this port is published to 127.0.0.1 only and must never be exposed further.
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: api
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gateway
                codec_type: AUTO
                # This is the edge. The client's address is the socket's, never one a header claims.
                use_remote_address: true
                xff_num_trusted_hops: 0
                # Every request gets an x-request-id here; it is passed upstream and the services log it.
                generate_request_id: true
                # x-user-id is the gateway's own header: whatever a client sent under that name is dropped
                # before anything looks at the request, and jwt_authn then sets it from the verified session.
                early_header_mutation_extensions:
                  - name: envoy.http.early_header_mutation.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
                      mutations:
                        - remove: x-user-id
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          route: "%ROUTE_NAME%"
                          status: "%RESPONSE_CODE%"
                          # flags is set when Envoy answered itself (NR = no route, RL = rate limited); details
                          # says exactly why: jwt_authn_access_denied{...} is the token check, local_rate_limited
                          # the local bucket, request_rate_limited the global service, via_upstream a service.
                          flags: "%RESPONSE_FLAGS%"
                          details: "%RESPONSE_CODE_DETAILS%"
                          user: "%REQ(X-USER-ID)%"
                          client: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          upstream: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                # What Envoy answers when it refuses a request itself: JSON {code, message}, like the services.
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison: { op: EQ, value: { default_value: 401, runtime_key: gateway.local_reply.unauthenticated } }
                      body_format_override:
                        json_format: { code: UNAUTHENTICATED, message: "%LOCAL_REPLY_BODY%" }
                    - filter:
                        status_code_filter:
                          comparison: { op: EQ, value: { default_value: 429, runtime_key: gateway.local_reply.rate_limited } }
                      # Retry-After: the global limit says how long until its window resets (x-ratelimit-reset, in
                      # seconds). ADD_IF_ABSENT leaves alone the "1" a local-limit reply already carries.
                      headers_to_add:
                        - append_action: ADD_IF_ABSENT
                          header: { key: retry-after, value: "%RESP(X-RATELIMIT-RESET)%" }
                      body_format_override:
                        json_format: { code: RATE_LIMITED, message: "too many requests, retry later" }
                http_filters:
                  # JWT check. Two providers, both HS256 with a key from the environment (entrypoint.sh): a JWK that
                  # names its algorithm only verifies tokens signed with that algorithm, so `none` and HS512 fail.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        # Who the caller is: issued by order-api's login, sent as "Authorization: Bearer <token>".
                        session:
                          issuer: order-api
                          audiences: [session]
                          from_headers:
                            - { name: Authorization, value_prefix: "Bearer " }
                          forward: true
                          clock_skew_seconds: 2
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"oct","alg":"HS256","k":"${SESSION_JWK_K}"}]}'
                          # For the rate limiter only. The services never read it: they verify the token themselves.
                          claim_to_headers:
                            - { header_name: x-user-id, claim_name: sub }
                        # That the waiting room admitted them: issued by queue-svc, sent as "X-Admission-Token".
                        admission:
                          issuer: queue-svc
                          audiences: [reserve]
                          from_headers:
                            - { name: x-admission-token }
                          forward: true
                          clock_skew_seconds: 2
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"oct","alg":"HS256","k":"${ADMISSION_JWK_K}"}]}'
                      rules:
                        # The first rule that matches decides.
                        - match: { path: /api/auth/dev-login }
                        - match: { path: /api/reserve }
                          requires:
                            requires_all:
                              requirements:
                                - provider_name: session
                                - provider_name: admission
                        - match: { prefix: /api/ }
                          requires: { provider_name: session }
                  # Global rate limit: asks the ratelimit service about the descriptors of the matched route.
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: flashsale
                      # Fail OPEN: if the ratelimit service is slow or down, requests go through. The JWT check
                      # above and the services' own checks still stand, and the admission token still gates reserve.
                      failure_mode_deny: false
                      timeout: 0.05s
                      # x-ratelimit-limit / -remaining / -reset on the responses of limited routes.
                      enable_x_ratelimit_headers: DRAFT_VERSION_03
                      rate_limit_service:
                        transport_api_version: V3
                        grpc_service:
                          envoy_grpc: { cluster_name: ratelimit }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: api
                  virtual_hosts:
                    - name: api
                      domains: ["*"]
                      # Each route's name is also its rate-limit key and its label in the metrics. POST routes
                      # are never retried.
                      routes:
                        # POST /api/auth/dev-login -> order-api /auth/dev-login
                        # No session yet, so the global limit is per client address only.
                        - name: login
                          match:
                            path: /api/auth/dev-login
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route:
                            cluster: order-api
                            prefix_rewrite: /auth/dev-login
                            timeout: 2s
                            rate_limits:
                              - actions:
                                  - generic_key: { descriptor_value: login }
                                  - remote_address: {}
                        # POST /api/queue/:eventId/join -> queue-svc /queue/:eventId/join
                        - name: join
                          match:
                            safe_regex: { regex: "/api/queue/[^/]+/join" }
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route:
                            cluster: queue-svc
                            regex_rewrite: { pattern: { regex: "^/api/" }, substitution: / }
                            timeout: 2s
                            rate_limits:
                              - actions:
                                  - generic_key: { descriptor_value: join }
                                  - request_headers: { header_name: x-user-id, descriptor_key: user_id }
                              - actions:
                                  - generic_key: { descriptor_value: join }
                                  - remote_address: {}
                        # GET /api/queue/:eventId/status -> queue-svc /queue/:eventId/status
                        - name: status
                          match:
                            safe_regex: { regex: "/api/queue/[^/]+/status" }
                            headers: [{ name: ":method", string_match: { exact: GET } }]
                          route:
                            cluster: queue-svc
                            regex_rewrite: { pattern: { regex: "^/api/" }, substitution: / }
                            timeout: 2s
                            rate_limits:
                              - actions:
                                  - generic_key: { descriptor_value: status }
                                  - request_headers: { header_name: x-user-id, descriptor_key: user_id }
                              - actions:
                                  - generic_key: { descriptor_value: status }
                                  - remote_address: {}
                        # POST /api/reserve -> ticket service /redis/reserve
                        - name: reserve
                          match:
                            path: /api/reserve
                            headers: [{ name: ":method", string_match: { exact: POST } }]
                          route:
                            cluster: ticket
                            prefix_rewrite: /redis/reserve
                            timeout: 1s
                            rate_limits:
                              - actions:
                                  - generic_key: { descriptor_value: reserve }
                                  - request_headers: { header_name: x-user-id, descriptor_key: user_id }
                              - actions:
                                  - generic_key: { descriptor_value: reserve }
                                  - remote_address: {}
                        # /api/orders/* -> order-api /orders/*
                        # No rate limit of either kind.
                        - name: orders
                          match:
                            prefix: /api/orders/
                          route:
                            cluster: order-api
                            prefix_rewrite: /orders/
                            timeout: 3s
                        # The web app arrives with the Next.js pages (item 5):
                        # - name: web
                        #   match: { prefix: / }
                        #   route: { cluster: web }

  clusters:
    # order-api: the login and /orders. services/order, PORT 3003.
    - name: order-api
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: order-api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3003 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /healthz/ready }
      outlier_detection:
        consecutive_5xx: 5
        base_ejection_time: 30s
    # The reservation API. services/ticket, PORT 3001.
    - name: ticket
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: ticket
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3001 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /healthz/ready }
      outlier_detection:
        consecutive_5xx: 5
        base_ejection_time: 30s
    # The waiting room. services/queue, PORT 4100.
    - name: queue-svc
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: queue-svc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 4100 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /readyz }
      outlier_detection:
        consecutive_5xx: 5
        base_ejection_time: 30s
    # The ratelimit service, in compose. gRPC, so HTTP/2.
    - name: ratelimit
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ratelimit
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ratelimit, port_value: 8081 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          grpc_health_check: {}
      outlier_detection:
        consecutive_5xx: 5
        base_ejection_time: 30s
