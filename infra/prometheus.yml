# Prometheus for local load testing. Mounted by infra/docker/docker-compose.yml.
#
# k6 metrics do NOT come from a scrape job: k6 exposes no /metrics endpoint (port 6565 is its REST
# control API, off by default). k6 pushes to this server's remote-write receiver instead:
#
#   make loadtest-baseline VARIANT=atomic TARGET_RPS=500
#   # = k6 run -o experimental-prometheus-rw, K6_PROMETHEUS_RW_SERVER_URL=http://localhost:9090/api/v1/write
#
# The receiver is switched on by --web.enable-remote-write-receiver in the compose file.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Add services here once they expose /metrics. From inside the container the host machine is
  # `host.docker.internal`, not `localhost`, e.g.:
  # - job_name: ticket
  #   static_configs:
  #     - targets: ["host.docker.internal:3001"]
