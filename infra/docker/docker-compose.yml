services:
  postgres:
    image: postgres:17          # pin exact minor
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: flashsale
    # host 5434 (another project already owns 5432/5433) -> container 5432, where postgres listens
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s

  redis:
    image: redis:7.4            # or valkey/valkey:8
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    # host 6380 (another project already owns 6379) -> container 6379, where redis listens
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Stream length and the relay group's backlog, read from Redis itself. The relay exports its own
  # view of these, but that goes dark exactly when the relay is down, which is when they matter.
  redis-exporter:
    image: oliver006/redis_exporter:latest   # pin a version
    depends_on: [redis]
    command:
      - --redis.addr=redis://redis:6379
      - --check-streams=ev:*:stream
    ports: ["9121:9121"]

  redpanda:                     # Kafka-API compatible, single binary, light on RAM
    image: docker.redpanda.com/redpandadata/redpanda:latest   # pin a version
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s

  kafka-ui:                     # topics, messages and consumer groups at http://localhost:8081
    image: kafbat/kafka-ui:latest   # pin a version
    depends_on: [redpanda]
    # host 8081: 8080 belongs to the API gateway (envoy, below)
    ports: ["8081:8080"]
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local-cluster
      # Redpanda is the broker and speaks the Kafka protocol, so the UI reads it directly. Inside the
      # compose network that is its internal listener, not the localhost:19092 the services use.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092

  jaeger:
    image: jaegertracing/jaeger:latest   # pin a version
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:latest   # pin a version
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # k6 has no scrape endpoint; it PUSHES via `-o experimental-prometheus-rw` to /api/v1/write.
      - --web.enable-remote-write-receiver
      # Lets k6 send native histograms (K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true) if wanted.
      - --enable-feature=native-histograms
    ports: ["9090:9090"]
    # prometheus.yml scrapes the ticket service on the host via host.docker.internal. Docker Desktop
    # resolves that name on its own; this line makes it work on Linux engines too.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      # Paths are relative to this compose file (infra/docker/).
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s

  grafana:
    image: grafana/grafana:latest   # pin a version
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # local dev only
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ---- API gateway ---------------------------------------------------------------------------
  # Envoy is the one port clients use. It routes /api/* to the services, checks the session and
  # admission JWTs at the edge and rate limits in two layers (infra/envoy/envoy.yaml). The services
  # themselves run on the host (`make dev`), so Envoy reaches them through host.docker.internal.
  envoy:
    image: envoyproxy/envoy:v1.39.3
    depends_on: [ratelimit]
    # envoy.yaml is a template: the entrypoint fills in the JWT keys and the local limits from the
    # environment below, then starts Envoy. No secret is in the file itself.
    entrypoint: ["/bin/sh", "/etc/envoy/gateway/entrypoint.sh"]
    env_file: [../envoy/limits.env]
    environment:
      # From infra/docker/.env (see .env.example). The same values the services run with.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in infra/docker/.env, see .env.example}
      ADMISSION_SECRET: ${ADMISSION_SECRET:?set ADMISSION_SECRET in infra/docker/.env, see .env.example}
    ports:
      - "8080:8080"             # the API
      - "127.0.0.1:9901:9901"   # admin, this machine only: its config dump shows the JWT keys
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../envoy:/etc/envoy/gateway:ro
    healthcheck:
      # The image has no curl or wget. This asks the admin port whether Envoy is serving; it says
      # nothing about the services behind it, which Envoy health-checks itself.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9901 &&
          printf 'GET /ready HTTP/1.1\r\nHost: envoy\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q LIVE <&3
      interval: 5s

  # The global rate-limit service Envoy asks: per-user and per-address counters per route, with the
  # limits in infra/ratelimit/config/. gRPC on 8081, /healthcheck on 8080, /metrics on 9090; none
  # of them is published, only Envoy and Prometheus talk to it.
  ratelimit:
    image: envoyproxy/ratelimit:f4e76690   # this image has only commit-hash tags; master of 2026-10-06
    depends_on:
      redis-ratelimit:
        condition: service_healthy
    environment:
      LOG_LEVEL: warn
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: redis-ratelimit:6379
      # Config is read from RUNTIME_ROOT/RUNTIME_SUBDIRECTORY/config/*.yaml, once at start.
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_WATCH_ROOT: "false"
      RUNTIME_IGNOREDOTFILES: "true"
      USE_STATSD: "false"
      USE_PROMETHEUS: "true"
      PROMETHEUS_ADDR: ":9090"
    volumes:
      - ../ratelimit/config:/data/ratelimit/config:ro

  # Counters for the rate limiter, and nothing else: deliberately NOT the inventory Redis, so a
  # flood of rate-limit keys can never evict or slow down stock. Every key it holds has a TTL and
  # losing them all only resets the windows, so it keeps nothing on disk.
  redis-ratelimit:
    image: redis:7.4
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  prometheus-data:
  grafana-storage: